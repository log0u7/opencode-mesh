name: Publish npm

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Build
        run: pnpm build

      # The 0.31.0 + 0.32.0 incidents (2026-11-26): the publish step printed
      # its success line — and the registry LOST the tarball (GET 404 on the
      # official dist URL) TWICE in three publishes. A success line is not
      # proof: the job only passes when the registry actually serves the
      # tarball. When it does not, the publish RETRIES (up to 3 rounds: the
      # loss is intermittent, a retry usually lands) — the release heals
      # itself instead of dying red and waiting for a human.
      - name: Publish with registry proof (up to 3 rounds)
        run: |
          PKG="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          for round in 1 2 3; do
            echo "=== round $round: publish ==="
            pnpm publish --access public --no-git-checks || true
            OK=0
            for i in $(seq 1 12); do
              URL="$(npm view "$PKG@$VER" dist.tarball 2>/dev/null || true)"
              if [ -n "$URL" ] && [ "$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' "$URL")" = "200" ]; then
                echo "verified: $URL"
                OK=1
                break
              fi
              echo "attempt $i/12: $PKG@$VER not served yet (packument/tarball lag or loss)"
              sleep 10
            done
            if [ "$OK" = "1" ]; then
              echo "the registry serves $PKG@$VER (round $round)"
              exit 0
            fi
            echo "::warning::round $round failed: the registry never served $PKG@$VER"
            # A zombie packument (the version registered, the blob lost)
            # blocks the next publish with E409 — a round that wrote the
            # packument needs the version UNPUBLISHED before retrying. The
            # job cannot unpublish (no token by design): fail loudly and let
            # the operator clear the zombie.
            REGISTERED="$(npm view "$PKG@$VER" version 2>/dev/null || true)"
            if [ -n "$REGISTERED" ]; then
              # Fastly caches NEGATIVE responses: a curl 404 during blob
              # propagation gets re-served ~10 min (live on 0.31.0 — a healthy
              # version looked lost). npm pack is the REAL client path: a pack
              # success means the blob serves and the curl lied.
              if npm pack "$PKG@$VER" --pack-destination /tmp >/dev/null 2>&1; then
                echo "verified (npm pack): $PKG@$VER serves — the curl 404 was a cached negative"
                exit 0
              fi
              echo "::error::zombie: $PKG@$VER is registered but its tarball is lost (npm pack fails). BEFORE unpublishing: run npm pack $PKG@$VER yourself past the ~10 min Fastly negative-cache window — a pack success means the version is HEALTHY. If it still fails: npm unpublish $PKG@$VER --force, then re-run this workflow."
              exit 1
            fi
          done
          echo "::error::3 rounds, the registry never served $PKG@$VER — the publish is LOST"
          exit 1
