name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.x", "24.x"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Canonical verification
        run: pnpm verify

      # tsconfig.json only includes src/: tests were never typechecked.
      - name: Typecheck tests
        run: pnpm run typecheck:tests

      # vitest thresholds only apply with --coverage: keep the fast verify for
      # the dev loop and enforce 90/80 here.
      - name: Coverage gate
        run: pnpm run test:coverage

      - name: Build and pack dry-run
        run: pnpm run build:check

  # The production engine is bun (the compiled OpenCode runtime embeds
  # bun:sqlite): the node matrix cannot catch an engine-name drift like the
  # 0.28.0 inTransaction no-op (bun names the state inTransaction, node
  # isTransaction — node stayed green while prod was disarmed). Run the
  # engine-sensitive suites under bun on every PR.
  bun-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Engine-sensitive suites under bun
        run: bun --bun vitest run tests/lib.wake.test.ts tests/lib.mail.test.ts

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
